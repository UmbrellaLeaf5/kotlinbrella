name: Docs

on:
  push:
    tags:
      - '*'

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Extract version from tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG#v}
          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Tag must be a version like 0.1.0 (optional leading v), got: $TAG"
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> $GITHUB_ENV
      - name: Build Dokka site
        run: ./gradlew :dokkaGenerate
      - name: Deploy versioned docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/dokka/html
          destination_dir: ${{ env.VERSION }}
          keep_files: true
          enable_jekyll: false
      - name: Point site root at latest version
        run: |
          mkdir -p site-root
          cat > site-root/index.html <<EOF
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./${{ env.VERSION }}/">
              <link rel="canonical" href="./${{ env.VERSION }}/">
              <title>Kotlinbrella ${{ env.VERSION }}</title>
            </head>
            <body>
              <p><a href="./${{ env.VERSION }}/">Kotlinbrella ${{ env.VERSION }}</a></p>
            </body>
          </html>
          EOF
      - name: Deploy site root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site-root
          keep_files: true
          enable_jekyll: false
