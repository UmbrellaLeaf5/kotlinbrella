name: Publish to GitHub Packages

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Extract version from tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG#v}
          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Tag must be a version like 0.1.0 (optional leading v), got: $TAG"
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> $GITHUB_ENV
      - name: Build and test
        run: ./gradlew build -Pversion=${{ env.VERSION }}
      - name: Publish packages
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository -Pversion=${{ env.VERSION }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub release
        run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
